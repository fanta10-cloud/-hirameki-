
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>온라인 도장판</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --cream:#FBF3E4;
    --card:#FFFDF8;
    --brown-900:#3E2A1C;
    --brown-700:#6B4226;
    --brown-500:#9C6B3F;
    --brown-300:#C9946B;
    --peach:#F6E1C4;
    --peach-2:#F0D2A8;
    --orange:#E8871E;
    --orange-dark:#C96E10;
    --stamp:#B5342E;
    --stamp-dark:#8E2621;
    --ring:#E9D8BE;
    --danger:#B5342E;
    --shadow: 0 6px 18px rgba(62,42,28,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(232,135,30,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(181,52,46,0.08), transparent 40%),
      var(--cream);
    color:var(--brown-900);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
    transition:background-color .25s ease;
  }
  h1,h2,h3,.display{font-family:'Jua', 'Noto Sans KR', sans-serif; font-weight:400;}
  .wrap{max-width:1040px;margin:0 auto;}

  .eyebrow{
    text-align:center; letter-spacing:.14em; font-size:11px; font-weight:700;
    color:var(--orange-dark); text-transform:uppercase; margin-bottom:6px;
  }
  .headline{
    text-align:center; font-size:34px; margin:0 0 4px; color:var(--brown-900);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .headline .paw{font-size:30px;}
  .subline{text-align:center;color:var(--brown-500);font-size:13.5px;margin-bottom:28px;}

  .card{
    background:var(--card); border-radius:22px; box-shadow:var(--shadow);
    border:1px solid var(--ring); padding:26px;
  }
  .btn{
    font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:14px;
    border:none; border-radius:14px; padding:12px 18px; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:disabled{opacity:0.55; cursor:default;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--orange); color:#fff; box-shadow:0 4px 0 var(--orange-dark);}
  .btn-primary:hover{background:#ee9a35;}
  .btn-primary:active{box-shadow:0 1px 0 var(--orange-dark); transform:translateY(3px) scale(0.99);}
  .btn-ghost{background:transparent; color:var(--brown-700); border:1.5px solid var(--brown-300);}
  .btn-ghost:hover{background:var(--peach);}
  .btn-danger{background:#fff; color:var(--danger); border:1.5px solid var(--danger);}
  .btn-danger:hover{background:#fdecea;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:10px;}

  input[type=text], input[type=password], input[type=tel], input[type=number], textarea, select{
    font-family:'Noto Sans KR',sans-serif; font-size:15px;
    border:1.5px solid var(--ring); background:#fff; color:var(--brown-900);
    border-radius:12px; padding:11px 14px; width:100%; outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--orange);}
  label{font-size:12.5px; font-weight:700; color:var(--brown-500); display:block; margin:0 0 6px 2px;}
  .field{margin-bottom:14px;}
  .hint{font-size:12px; color:var(--brown-500); margin-top:6px;}
  .error-box{
    background:#FBEAEA; color:var(--danger); border:1px solid #EFC5C2;
    border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px; font-weight:500;
  }

  .login-shell{max-width:420px; margin:0 auto;}
  .wizard-shell{max-width:520px; margin:0 auto;}
  .tabs{display:flex; gap:8px; margin-bottom:18px; background:var(--peach); padding:5px; border-radius:14px;}
  .tab{
    flex:1; text-align:center; padding:10px 0; border-radius:10px; cursor:pointer;
    font-weight:700; font-size:14px; color:var(--brown-500); transition:all .15s ease;
  }
  .tab.active{background:#fff; color:var(--brown-900); box-shadow:0 2px 6px rgba(62,42,28,0.12);}

  /* ---------- wizard ---------- */
  .wizard-progress{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px;}
  .wizard-dot{width:9px; height:9px; border-radius:50%; background:var(--peach-2);}
  .wizard-dot.active{background:var(--orange); width:22px; border-radius:6px;}
  .wizard-step-title{font-size:19px; margin:0 0 4px;}
  .wizard-step-desc{font-size:12.5px; color:var(--brown-500); margin-bottom:18px;}
  .step-actions{display:flex; gap:8px; margin-top:20px;}
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px; margin-top:6px;}
  .theme-swatch{
    border:2px solid var(--ring); border-radius:16px; padding:12px 8px; text-align:center; cursor:pointer;
    background:#fff; transition:border-color .15s ease, transform .1s ease;
  }
  .theme-swatch:hover{transform:translateY(-2px);}
  .theme-swatch.active{border-color:var(--orange); box-shadow:0 0 0 3px rgba(232,135,30,0.18);}
  .theme-swatch .dots{display:flex; justify-content:center; gap:4px; margin-bottom:8px;}
  .theme-swatch .dot{width:14px;height:14px;border-radius:50%;}
  .theme-swatch .mascot{font-size:20px; margin-bottom:4px;}
  .theme-swatch .tlabel{font-size:11.5px; font-weight:700; color:var(--brown-700);}
  .count-row{display:flex; align-items:center; gap:10px;}
  .count-row input{width:90px; flex:none;}
  .summary-box{
    background:var(--peach); border-radius:14px; padding:14px 16px; font-size:13px; line-height:1.9; margin-bottom:16px;
  }
  .summary-box b{color:var(--brown-900);}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    max-width:1040px; margin:0 auto 20px; flex-wrap:wrap;
  }
  .who{display:flex; align-items:center; gap:10px;}
  .who-badge{
    width:38px;height:38px;border-radius:50%; background:var(--peach); display:flex;
    align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
  }
  .who-name{font-weight:700; font-size:15px;}
  .who-sub{font-size:12px; color:var(--brown-500);}
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .dash{display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start;}
  @media (max-width: 820px){ .dash{grid-template-columns:1fr;} }

  .roster-card{padding:18px;}
  .roster-search{margin-bottom:12px;}
  .roster-list{max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .roster-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px; border-radius:12px; cursor:pointer; border:1.5px solid transparent;
  }
  .roster-item:hover{background:var(--peach);}
  .roster-item.active{background:var(--peach-2); border-color:var(--orange);}
  .roster-item .rid{font-size:11.5px; color:var(--brown-500);}
  .roster-item .rname{font-weight:700; font-size:14px;}
  .roster-count{font-size:11.5px; font-weight:700; color:var(--orange-dark); background:#fff;
    border:1px solid var(--ring); padding:3px 8px; border-radius:20px; flex-shrink:0;}
  .roster-empty{text-align:center; color:var(--brown-500); font-size:13px; padding:30px 10px;}
  .roster-footer{display:flex; gap:8px; margin-top:14px;}

  .board-card{min-height:420px; display:flex; flex-direction:column;}
  .board-placeholder{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--brown-500); gap:8px; padding:40px 10px; text-align:center;
  }
  .board-placeholder .big{font-size:40px;}

  .board-head{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:18px;}
  .board-head .name{font-size:20px; font-weight:900; font-family:'Jua';}
  .board-head .id{font-size:12.5px; color:var(--brown-500);}
  .progress-pill{
    background:var(--peach); border-radius:20px; padding:8px 16px; font-weight:700; color:var(--orange-dark);
    font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .progress-bar-outer{width:80px; height:8px; background:#fff; border-radius:10px; overflow:hidden; border:1px solid var(--ring);}
  .progress-bar-inner{height:100%; background:var(--orange); border-radius:10px; transition:width .3s ease;}

  .stamp-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:12px;
  }
  @media (max-width:560px){ .stamp-grid{grid-template-columns:repeat(3, 1fr);} }

  .stamp{
    position:relative; aspect-ratio:1/1; border-radius:50%;
    background:var(--peach); border:2px solid var(--peach-2);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-weight:700; font-size:14px; color:var(--brown-700); padding:6px;
    user-select:none; overflow:hidden;
  }
  .stamp.milestone{background:#FBDDB9; border-color:var(--orange); font-size:11.5px; line-height:1.25; font-weight:900;}
  .stamp.clickable{cursor:pointer;}
  .stamp.clickable:hover{filter:brightness(0.97);}
  .stamp.clickable:active{transform:scale(0.95);}
  .stamp .label{position:relative; z-index:1; pointer-events:none;}
  .stamp.stamped .label{opacity:0.18;}

  .ink{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    opacity:0; z-index:2; pointer-events:none;
  }
  .stamp.stamped .ink{opacity:1;}
  .ink svg{width:78%; height:78%; animation:stampDown .32s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes stampDown{
    0%{ transform:scale(1.9) rotate(-18deg); opacity:0; }
    60%{ transform:scale(0.92) rotate(-7deg); opacity:1; }
    100%{ transform:scale(1) rotate(-9deg); opacity:1; }
  }

  .modal-bg{
    position:fixed; inset:0; background:rgba(62,42,28,0.45); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px; overflow-y:auto;
  }
  .modal{background:var(--card); border-radius:20px; padding:26px; max-width:420px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.25); margin:auto;}
  .modal h3{margin:0 0 14px; font-size:20px;}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}

  .footer-note{
    text-align:center; color:var(--brown-500); font-size:11.5px; margin-top:36px; line-height:1.6;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--brown-900);
    color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; z-index:80;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--peach-2); border-radius:10px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =======================================================
   온라인 도장판 (GitHub Pages + Google Sheets 버전)

   ▶▶▶ 다른 선생님이 이 파일을 복사해서 쓰실 때는
       아래 API_URL 한 줄만 자신의 Apps Script 웹 앱 주소로 바꾸면 됩니다.
       도장판 이름 / 개수 / 디자인은 처음 접속했을 때 뜨는 화면(마법사)에서 설정해요. ◀◀◀
*/
const API_URL = 'https://script.google.com/macros/s/AKfycbzHuA7Nxsq1V4oytcTpyIuIJM4WPyhnJmTRShFoNL8URT1QxHkOCgmvMjlXbkD_lt1gug/exec';

/* ---------------- 디자인 테마 ---------------- */
const THEMES = {
  bear:   { label:'곰돌이 브라운', mascot:'🐻', dots:['#6B4226','#E8871E','#F6E1C4'], vars:{
    '--cream':'#FBF3E4','--card':'#FFFDF8','--brown-900':'#3E2A1C','--brown-700':'#6B4226','--brown-500':'#9C6B3F','--brown-300':'#C9946B',
    '--peach':'#F6E1C4','--peach-2':'#F0D2A8','--orange':'#E8871E','--orange-dark':'#C96E10','--stamp':'#B5342E','--stamp-dark':'#8E2621',
    '--ring':'#E9D8BE','--danger':'#B5342E' } },
  ocean:  { label:'바다 블루', mascot:'🐳', dots:['#173A45','#2E9CB5','#D6EEF2'], vars:{
    '--cream':'#EAF4F6','--card':'#FFFFFF','--brown-900':'#173A45','--brown-700':'#2B6777','--brown-500':'#5B8A99','--brown-300':'#9CC3CE',
    '--peach':'#D6EEF2','--peach-2':'#BFE3EA','--orange':'#2E9CB5','--orange-dark':'#1F7C90','--stamp':'#C0392B','--stamp-dark':'#96281B',
    '--ring':'#CFE7EC','--danger':'#C0392B' } },
  forest: { label:'숲속 그린', mascot:'🦉', dots:['#2B3A25','#6B9B45','#E1EBD6'], vars:{
    '--cream':'#F1F5EC','--card':'#FFFFFF','--brown-900':'#2B3A25','--brown-700':'#4C6B3B','--brown-500':'#7B9A66','--brown-300':'#AFC79A',
    '--peach':'#E1EBD6','--peach-2':'#CFE0BE','--orange':'#6B9B45','--orange-dark':'#527A34','--stamp':'#A6432D','--stamp-dark':'#7E3220',
    '--ring':'#DCE9CD','--danger':'#A6432D' } },
  berry:  { label:'딸기 핑크', mascot:'🍓', dots:['#5C1F2A','#E15873','#F8DCE0'], vars:{
    '--cream':'#FDF1F1','--card':'#FFFFFF','--brown-900':'#5C1F2A','--brown-700':'#9A3B4C','--brown-500':'#C46A79','--brown-300':'#E3A6B0',
    '--peach':'#F8DCE0','--peach-2':'#F2C4CB','--orange':'#E15873','--orange-dark':'#BD3E58','--stamp':'#B5342E','--stamp-dark':'#8E2621',
    '--ring':'#F1D2D6','--danger':'#B5342E' } },
  sunny:  { label:'해바라기 옐로우', mascot:'🌻', dots:['#5B4413','#E0A426','#FBEDBF'], vars:{
    '--cream':'#FEF8E8','--card':'#FFFFFF','--brown-900':'#5B4413','--brown-700':'#8A6A1F','--brown-500':'#B4913E','--brown-300':'#D8BE7C',
    '--peach':'#FBEDBF','--peach-2':'#F7E1A0','--orange':'#E0A426','--orange-dark':'#B9820F','--stamp':'#C0392B','--stamp-dark':'#96281B',
    '--ring':'#F1DFA8','--danger':'#C0392B' } },
};
function applyTheme(themeId){
  const t = THEMES[themeId] || THEMES.bear;
  Object.keys(t.vars).forEach(k => document.documentElement.style.setProperty(k, t.vars[k]));
  state.mascot = t.mascot;
}

/* ---------------- state ---------------- */
let LAYOUT = [];
let TOTAL = 0;

let state = {
  screen: 'loading',      // loading | setupNeeded | wizard | login | teacherDash | studentDash
  loginTab: 'student',
  board: null,             // {schoolName, subjectName, theme, layout}
  roster: {},
  currentUser: null,
  selectedStudentId: null,
  error: '',
  modal: null,
  busy: false,
  mascot: '🐻',
};

const app = document.getElementById('app');

/* ---------------- API helper ---------------- */
function apiCall(action, params){
  params = params || {};
  const usp = new URLSearchParams(Object.assign({action}, params));
  return fetch(API_URL + '?' + usp.toString())
    .then(r => r.json())
    .catch(err => { console.error(err); return { ok:false, error:'network' }; });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ---------------- init ---------------- */
async function init(){
  if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){
    state.screen = 'setupNeeded';
    render();
    return;
  }
  const cfg = await apiCall('getBoardConfig');
  if(!cfg || !cfg.ok || !cfg.configured){
    state.screen = 'wizard';
    resetWizard();
    render();
    return;
  }
  applyBoard(cfg);
  await refreshRoster();
  state.screen = 'login';
  render();
}

function applyBoard(cfg){
  state.board = { schoolName: cfg.schoolName, subjectName: cfg.subjectName, theme: cfg.theme, layout: cfg.layout };
  LAYOUT = cfg.layout;
  TOTAL = LAYOUT.length;
  applyTheme(cfg.theme);
  document.title = `${cfg.schoolName || ''} ${cfg.subjectName || ''} 도장판`.trim() || '온라인 도장판';
}

async function refreshRoster(){
  const res = await apiCall('getRoster');
  const roster = {};
  if(res && res.ok && Array.isArray(res.students)){
    res.students.forEach(s => { roster[idOf(s.classNum, s.number)] = s; });
  }
  state.roster = roster;
}
function idOf(classNum, number){ return `${classNum}-${number}`; }

/* ---------------- utils ---------------- */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stampCount(student){ return student.stamps.filter(Boolean).length; }
function pinValid(p){ return /^\d{4}$/.test(p); }
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* ---------------- render root ---------------- */
function render(){
  app.innerHTML = '';

  if(state.screen === 'loading'){
    app.appendChild(el(`<div style="text-align:center;padding:80px 10px;color:var(--brown-500);">불러오는 중...</div>`));
    return;
  }

  if(state.screen === 'setupNeeded'){
    app.appendChild(renderHeader());
    app.appendChild(el(`
      <div class="wrap"><div class="card" style="max-width:520px;margin:0 auto;">
        <h3>설정이 필요해요</h3>
        <div class="hint" style="font-size:13.5px; line-height:1.7;">
          이 페이지 코드 상단의 <b>API_URL</b> 값이 아직 비어있어요.<br><br>
          1. Google Sheets를 만들고 Apps Script를 배포하세요.<br>
          2. 배포 후 나오는 웹 앱 URL을 복사하세요.<br>
          3. index.html 파일의 <code>const API_URL = '...'</code> 부분에 붙여넣고 저장한 뒤,
          다시 업로드하세요.<br>
          그 다음부터는 도장판 이름·개수·디자인을 화면에서 바로 설정할 수 있어요.
        </div>
      </div></div>
    `));
    return;
  }

  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(renderHeader());

  if(state.screen === 'wizard'){
    wrap.appendChild(renderWizard());
  } else if(state.screen === 'login'){
    wrap.appendChild(renderLogin());
  } else if(state.screen === 'teacherDash'){
    wrap.appendChild(renderTopbar());
    wrap.appendChild(renderTeacherDash());
  } else if(state.screen === 'studentDash'){
    wrap.appendChild(renderTopbar());
    wrap.appendChild(renderStudentDash());
  }

  wrap.appendChild(el(`<div class="footer-note">Google Sheets에 저장되어 어떤 기기에서 열어도 같은 기록을 확인할 수 있어요.</div>`));
  app.appendChild(wrap);

  if(state.modal) renderModal();
}

function renderHeader(){
  const school = state.board ? state.board.schoolName : '';
  const subject = state.board ? state.board.subjectName : '';
  const eyebrow = [school, subject].filter(Boolean).join(' · ') || '나만의 온라인 도장판';
  return el(`
    <div>
      <div class="eyebrow">${esc(eyebrow)}</div>
      <h1 class="headline"><span class="paw">${state.mascot}</span>온라인 도장판</h1>
      <div class="subline">도장은 선생님만 찍을 수 있어요 · 학생은 반과 번호로 진행 현황을 확인해요</div>
    </div>
  `);
}

function renderTopbar(){
  const isTeacher = state.currentUser.type === 'teacher';
  const student = !isTeacher ? state.roster[state.currentUser.id] : null;
  const bar = el(`
    <div class="topbar">
      <div class="who">
        <div class="who-badge">${isTeacher ? '🧑‍🏫' : '🎒'}</div>
        <div>
          <div class="who-name">${isTeacher ? '교사 모드' : esc(student ? student.name || '학생' : '')}</div>
          <div class="who-sub">${isTeacher ? '도장을 찍고 학생을 관리해요' : (student ? esc(student.classNum + '반 ' + student.number + '번') : '')}</div>
        </div>
      </div>
      <div class="topbar-actions"></div>
    </div>
  `);
  const actions = bar.querySelector('.topbar-actions');
  if(!isTeacher){
    const refreshBtn = el(`<button class="btn btn-ghost btn-sm">🔄 새로고침</button>`);
    refreshBtn.onclick = async () => {
      const res = await apiCall('studentLogin', {classNum: student.classNum, number: student.number, pin: state.currentUser.pin});

  logoutBtn.onclick = () => { state.currentUser = null; state.selectedStudentId = null; state.screen = 'login'; state.error=''; render(); };

  return bar;
}

      </div>
      <button class="btn btn-primary btn-block" id="studentLoginBtn">로그인</button>

  `);

    if(!classNum || !number || !pin){ state.error = '반, 번호, PIN을 모두 입력해주세요.'; render(); return; }

    const res = await apiCall('studentLogin', {classNum, number, pin});
    if(!res || !res.ok){
      state.error = res && res.error === 'bad_pin' ? 'PIN이 일치하지 않아요.' : '등록되지 않은 반/번호예요. 선생님께 등록을 요청해주세요.';

    const id = idOf(res.student.classNum, res.student.number);

    state.currentUser = {type:'student', id, pin};

function safeFileName(s){
  return String(s || '').replace(/[\\/:*?"<>|]/g, '').trim();
}

function exportToExcel(){
  const students = Object.values(state.roster);
  if(students.length === 0){ toast('내보낼 학생이 없어요.'); return; }

  const byClass = {};
  students.forEach(s => {
    const key = s.classNum;
    if(!byClass[key]) byClass[key] = [];
    byClass[key].push(s);
  });
  const classKeys = Object.keys(byClass).map(Number).sort((a,b) => a - b);

  const wb = XLSX.utils.book_new();

  // 전체 요약 시트
  const allRows = [['반', '번호', '이름', '도장 개수', `전체(${TOTAL})`, '완료율']];
  classKeys.forEach(c => {
    byClass[c].slice().sort((a,b) => a.number - b.number).forEach(s => {
      const cnt = stampCount(s);
      allRows.push([s.classNum, s.number, s.name || '', cnt, TOTAL, `${Math.round(cnt/TOTAL*100)}%`]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(allRows), '전체');

  // 반별 시트
  classKeys.forEach(c => {
    const rows = [['번호', '이름', '도장 개수', `전체(${TOTAL})`, '완료율']];
    byClass[c].slice().sort((a,b) => a.number - b.number).forEach(s => {
      const cnt = stampCount(s);
      rows.push([s.number, s.name || '', cnt, TOTAL, `${Math.round(cnt/TOTAL*100)}%`]);
    });
    const sheetName = safeFileName(`${c}반`).slice(0,31) || `${c}반`;
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  });

  const boardName = safeFileName([state.board.schoolName, state.board.subjectName].filter(Boolean).join('_')) || '도장판';
  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `${boardName}_도장현황_${dateStr}.xlsx`);
}

function buildRosterList(){
  const ids = Object.keys(state.roster).sort((a,b)=>{
    const sa = state.roster[a], sb = state.roster[b];
    if(sa.classNum !== sb.classNum) return sa.classNum - sb.classNum;
    return sa.number - sb.number;
  });
  const term = rosterSearchTerm.trim().toLowerCase();
  const filtered = ids.filter(id => {
    const s = state.roster[id];
    const label = `${s.classNum}반 ${s.number}번`.toLowerCase();
    return label.includes(term) || String(s.classNum).includes(term) || String(s.number).includes(term) || (s.name||'').toLowerCase().includes(term);
  });
  const list = el(`<div class="roster-list"></div>`);
  if(filtered.length === 0){
    list.appendChild(el(`<div class="roster-empty">등록된 학생이 없어요.<br>학생을 추가해보세요.</div>`));
    return list;
  }
  filtered.forEach(id => {
    const s = state.roster[id];
    const item = el(`
      <div class="roster-item ${state.selectedStudentId===id?'active':''}">
        <div>
          <div class="rname">${esc(s.name || '(이름 미등록)')}</div>
          <div class="rid">${esc(s.classNum)}반 ${esc(s.number)}번</div>
        </div>
        <div class="roster-count">${stampCount(s)}/${TOTAL}</div>
      </div>
    `);
    item.onclick = () => { state.selectedStudentId = id; render(); };
    list.appendChild(item);
  });
  return list;
}

    const toolbar = el(`
      <div style="display:flex; gap:8px; margin-top:20px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" id="resetPinBtn">학생 PIN 초기화 (0000)</button>
        <button class="btn btn-ghost btn-sm" id="editNameBtn">이름 수정</button>
        <button class="btn btn-danger btn-sm" id="delStudentBtn">학생 삭제</button>
      </div>
    `);
    toolbar.querySelector('#resetPinBtn').onclick = async () => {
      const res = await apiCall('resetStudentPin', {classNum: s.classNum, number: s.number, teacherPin: state.currentUser.pin});
      if(res && res.ok){ toast(`${s.name || ''} 학생의 PIN이 0000 으로 초기화되었어요.`); }
      else toast('초기화에 실패했어요.');
    };
    toolbar.querySelector('#editNameBtn').onclick = async () => {
      const newName = prompt('학생 이름을 입력하세요.', s.name || '');
      if(newName === null) return;
      const res = await apiCall('renameStudent', {classNum: s.classNum, number: s.number, name: newName.trim(), teacherPin: state.currentUser.pin});
      if(res && res.ok){ s.name = newName.trim(); render(); }
      else toast('이름 수정에 실패했어요.');
    };
    toolbar.querySelector('#delStudentBtn').onclick = async () => {
      if(!confirm(`정말 ${s.name || '이름 미등록'} (${s.classNum}반 ${s.number}번) 학생을 삭제할까요? 도장 기록도 함께 사라져요.`)) return;
      const res = await apiCall('deleteStudent', {classNum: s.classNum, number: s.number, teacherPin: state.currentUser.pin});
      if(res && res.ok){
        delete state.roster[state.selectedStudentId];
        state.selectedStudentId = null;
        render();
      } else toast('삭제에 실패했어요.');
    };
    panel.appendChild(toolbar);
  }

  return panel;
}

function stampSvg(){
  return `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--stamp)" stroke-width="6"/>
      <circle cx="50" cy="50" r="32" fill="none" stroke="var(--stamp)" stroke-width="2.5"/>
      <text x="50" y="58" text-anchor="middle" font-family="Jua, sans-serif" font-size="26" fill="var(--stamp-dark)">완료</text>
    </svg>
  `;
}

/* ---------------- STUDENT DASHBOARD ---------------- */
function renderStudentDash(){
  const wrap = el(`<div></div>`);
  wrap.appendChild(renderBoardPanel(false));
  return wrap;
}

/* ---------------- MODALS ---------------- */
function renderModal(){
  const bg = el(`<div class="modal-bg"></div>`);
  bg.onclick = (e) => { if(e.target === bg){ state.modal = null; render(); } };
  const modal = el(`<div class="modal"></div>`);

  if(state.modal === 'addStudent'){
    modal.appendChild(el(`<h3>학생 추가</h3>`));
    modal.appendChild(el(`
      <div class="field" style="display:flex; gap:10px;">
        <div style="flex:1;"><label>반</label><input type="text" id="mClass" inputmode="numeric" placeholder="예: 3"></div>
        <div style="flex:1;"><label>번호</label><input type="text" id="mNumber" inputmode="numeric" placeholder="예: 12"></div>
      </div>
      <div class="field"><label>이름 (선택)</label><input type="text" id="mName" placeholder="예: 홍길동"></div>
      <div class="field"><label>초기 PIN (4자리)</label><input type="text" id="mPin" maxlength="4" inputmode="numeric" value="0000"></div>
    `));
    const err = el(`<div class="error-box" style="display:none;"></div>`);
    modal.appendChild(err);
    const actions = el(`
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" id="cancelBtn">취소</button>
        <button class="btn btn-primary btn-block" id="saveBtn">추가</button>
      </div>
    `);
    actions.querySelector('#cancelBtn').onclick = () => { state.modal = null; render(); };
    actions.querySelector('#saveBtn').onclick = async () => {
      const classNum = modal.querySelector('#mClass').value.trim();
      const number = modal.querySelector('#mNumber').value.trim();
      const name = modal.querySelector('#mName').value.trim();
      const pin = modal.querySelector('#mPin').value.trim();
      if(!classNum || !number){ err.textContent='반과 번호를 입력해주세요.'; err.style.display='block'; return; }
      if(!/^\d+$/.test(classNum) || !/^\d+$/.test(number)){ err.textContent='반과 번호는 숫자로 입력해주세요.'; err.style.display='block'; return; }
      if(!pinValid(pin)){ err.textContent='PIN은 숫자 4자리여야 해요.'; err.style.display='block'; return; }
      const res = await apiCall('addStudent', {classNum, number, name, pin, teacherPin: state.currentUser.pin});
      if(!res || !res.ok){
        err.textContent = res && res.error === 'exists' ? '이미 등록된 반/번호예요.' : '추가에 실패했어요.';
        err.style.display='block'; return;
      }
      await refreshRoster();
      state.modal = null;
      state.selectedStudentId = idOf(classNum, number);
      render();
    };
    modal.appendChild(actions);
  }

  else if(state.modal === 'bulkAdd'){
    modal.appendChild(el(`<h3>학생 일괄 추가</h3>`));

    let bulkTab = 'file';
    let parsedRows = [];

    const subTabs = el(`
      <div class="tabs" style="margin-bottom:14px;">
        <div class="tab active" data-tab="file">엑셀 파일 업로드</div>
        <div class="tab" data-tab="text">직접 입력</div>
      </div>
    `);
    modal.appendChild(subTabs);

    const fileSection = el(`
      <div id="fileSection">
        <div class="hint" style="margin-bottom:10px;">
          <b>A열=반, B열=번호, C열=이름</b> 순서의 .xlsx / .xls / .csv 파일을 올려주세요. 헤더 행이 있어도 자동으로 인식해요.<br>
          초기 PIN은 모두 0000 으로 설정돼요.
        </div>
        <input type="file" id="xlsxFile" accept=".xlsx,.xls,.csv">
        <div id="filePreview" class="hint" style="margin-top:10px;"></div>
      </div>
    `);
    modal.appendChild(fileSection);

    const textSection = el(`
      <div id="textSection" style="display:none;">
        <div class="hint" style="margin-bottom:10px;">한 줄에 한 명씩, <b>반,번호,이름</b> 형식으로 입력하세요.<br>예) 3,12,홍길동</div>
        <textarea id="bulkText" rows="7" placeholder="1,1,김민준&#10;1,2,이서연&#10;1,3,박도윤"></textarea>
      </div>
    `);
    modal.appendChild(textSection);

    subTabs.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        bulkTab = t.dataset.tab;
        subTabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        fileSection.style.display = bulkTab === 'file' ? '' : 'none';
        textSection.style.display = bulkTab === 'text' ? '' : 'none';
      };
    });

    const err = el(`<div class="error-box" style="display:none; margin-top:12px;"></div>`);
    modal.appendChild(err);

    async function parseFile(file){
      const ext = file.name.split('.').pop().toLowerCase();
      let wb;
      if(ext === 'csv'){
        const text = await file.text();
        wb = XLSX.read(text, {type:'string'});
      } else {
        const buf = await file.arrayBuffer();
        wb = XLSX.read(buf, {type:'array'});
      }
      const sheet = wb.Sheets[wb.SheetNames[0]];
      let rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
      rows = rows
        .map(r => [String(r[0]||'').trim(), String(r[1]||'').trim(), String(r[2]||'').trim()])
        .filter(r => r[0] !== '' || r[1] !== '');
      if(rows.length && (isNaN(Number(rows[0][0])) || isNaN(Number(rows[0][1])))) rows.shift();
      rows = rows.filter(r => r[0] !== '' && r[1] !== '' && !isNaN(Number(r[0])) && !isNaN(Number(r[1])));
      return rows;
    }

    fileSection.querySelector('#xlsxFile').onchange = async (e) => {
      const file = e.target.files[0];
      const preview = fileSection.querySelector('#filePreview');
      err.style.display = 'none';
      if(!file){ preview.textContent = ''; parsedRows = []; return; }
      try{
        parsedRows = await parseFile(file);
        if(parsedRows.length === 0){
          preview.textContent = '';
          err.textContent = '파일에서 인식된 학생 정보가 없어요. 열 순서를 확인해주세요.';
          err.style.display = 'block';
        } else {
          const sample = parsedRows.slice(0,3).map(r => `${r[0]}반${r[1]}번${r[2] ? ' '+r[2] : ''}`).join(', ');
          preview.innerHTML = `✅ 총 <b>${parsedRows.length}명</b> 인식됨 — ${esc(sample)}${parsedRows.length>3 ? ' 외' : ''}`;
        }
      }catch(err2){
        console.error(err2);
        preview.textContent = '';
        err.textContent = '파일을 읽는 중 문제가 생겼어요. 파일 형식을 확인해주세요.';
        err.style.display = 'block';
      }
    };

    const actions = el(`
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" id="cancelBtn">취소</button>
        <button class="btn btn-primary btn-block" id="saveBtn">일괄 추가</button>
      </div>
    `);
    actions.querySelector('#cancelBtn').onclick = () => { state.modal = null; render(); };
    actions.querySelector('#saveBtn').onclick = async () => {
      let rows = [];
      if(bulkTab === 'file'){
        if(parsedRows.length === 0){ err.textContent='업로드된 파일에서 인식된 학생이 없어요.'; err.style.display='block'; return; }
        rows = parsedRows;
      } else {
        const text = modal.querySelector('#bulkText').value;
        rows = text.split('\n').map(l=>l.trim()).filter(Boolean).map(line => {
          const parts = line.split(',').map(p=>p.trim());
          return [parts[0] || '', parts[1] || '', parts[2] || ''];
        }).filter(r => r[0] !== '' && r[1] !== '' && !isNaN(Number(r[0])) && !isNaN(Number(r[1])));
        if(rows.length === 0){ err.textContent='입력된 학생이 없어요. "반,번호,이름" 형식을 확인해주세요.'; err.style.display='block'; return; }
      }
      const res = await apiCall('bulkAdd', {rows: JSON.stringify(rows), teacherPin: state.currentUser.pin});
      if(!res || !res.ok){ err.textContent='일괄 추가에 실패했어요.'; err.style.display='block'; return; }
      await refreshRoster();
      state.modal = null;
      render();
      alert(`${res.added}명 추가 완료${res.skipped ? `, ${res.skipped}명은 중복/형식 오류로 건너뛰었어요.` : '.'}`);
    };
    modal.appendChild(actions);
  }

  else if(state.modal === 'changePin'){
    const s = state.roster[state.currentUser.id];
    modal.appendChild(el(`<h3>내 PIN 변경</h3>`));
    modal.appendChild(el(`
      <div class="field"><label>새 PIN (4자리)</label><input type="password" id="p1" maxlength="4" inputmode="numeric"></div>
      <div class="field"><label>새 PIN 확인</label><input type="password" id="p2" maxlength="4" inputmode="numeric"></div>
    `));
    const err = el(`<div class="error-box" style="display:none;"></div>`);
    modal.appendChild(err);
    const actions = el(`
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" id="cancelBtn">취소</button>
        <button class="btn btn-primary btn-block" id="saveBtn">변경</button>
      </div>
    `);
    actions.querySelector('#cancelBtn').onclick = () => { state.modal = null; render(); };
    actions.querySelector('#saveBtn').onclick = async () => {
      const p1 = modal.querySelector('#p1').value.trim();
      const p2 = modal.querySelector('#p2').value.trim();
      if(!pinValid(p1)){ err.textContent='PIN은 숫자 4자리로 입력해주세요.'; err.style.display='block'; return; }
      if(p1 !== p2){ err.textContent='두 PIN이 일치하지 않아요.'; err.style.display='block'; return; }
      const res = await apiCall('changeStudentPin', {classNum: s.classNum, number: s.number, oldPin: state.currentUser.pin, newPin: p1});
      if(!res || !res.ok){ err.textContent='PIN 변경에 실패했어요.'; err.style.display='block'; return; }
      state.currentUser.pin = p1;
      state.modal = null;
      render();
      alert('PIN이 변경되었어요.');
    };
    modal.appendChild(actions);
  }

  else if(state.modal === 'teacherPinChange'){
    modal.appendChild(el(`<h3>교사 PIN 변경</h3>`));
    modal.appendChild(el(`
      <div class="field"><label>현재 PIN</label><input type="password" id="cur" maxlength="4" inputmode="numeric"></div>
      <div class="field"><label>새 PIN (4자리)</label><input type="password" id="p1" maxlength="4" inputmode="numeric"></div>
      <div class="field"><label>새 PIN 확인</label><input type="password" id="p2" maxlength="4" inputmode="numeric"></div>
    `));
    const err = el(`<div class="error-box" style="display:none;"></div>`);
    modal.appendChild(err);
    const actions = el(`
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" id="cancelBtn">취소</button>
        <button class="btn btn-primary btn-block" id="saveBtn">변경</button>
      </div>
    `);
    actions.querySelector('#cancelBtn').onclick = () => { state.modal = null; render(); };
    actions.querySelector('#saveBtn').onclick = async () => {
      const cur = modal.querySelector('#cur').value.trim();
      const p1 = modal.querySelector('#p1').value.trim();
      const p2 = modal.querySelector('#p2').value.trim();
      if(!pinValid(p1)){ err.textContent='새 PIN은 숫자 4자리로 입력해주세요.'; err.style.display='block'; return; }
      if(p1 !== p2){ err.textContent='두 PIN이 일치하지 않아요.'; err.style.display='block'; return; }
      const res = await apiCall('changeTeacherPin', {oldPin: cur, newPin: p1});
      if(!res || !res.ok){ err.textContent='현재 PIN이 일치하지 않아요.'; err.style.display='block'; return; }
      state.currentUser.pin = p1;
      state.modal = null;
      render();
      alert('교사 PIN이 변경되었어요.');
    };
    modal.appendChild(actions);
  }

  else if(state.modal === 'editBoard'){
    let ebLabelMode = 'custom';
    let ebCustomText = LAYOUT.join('\n');
    let ebTheme = state.board.theme;

    modal.appendChild(el(`<h3>도장판 설정 수정</h3>`));
    modal.appendChild(el(`
      <div class="field"><label>학교 이름</label><input type="text" id="ebSchool" value="${esc(state.board.schoolName||'')}"></div>
      <div class="field"><label>과목 / 반 이름</label><input type="text" id="ebSubject" value="${esc(state.board.subjectName||'')}"></div>
      <div class="field"><label>도장 이름 목록 (한 줄에 하나씩)</label><textarea id="ebLabels" rows="6">${esc(ebCustomText)}</textarea></div>
      <div class="hint" style="margin-bottom:10px;">⚠ 개수를 줄이면 뒤쪽 칸의 도장 기록이 사라져요. 개수를 늘리면 새 칸은 빈 도장으로 시작해요.</div>
      <div class="field"><label>디자인 테마</label><div class="theme-grid" id="ebThemeGrid"></div></div>
    `));
    const themeGrid = modal.querySelector('#ebThemeGrid');
    Object.keys(THEMES).forEach(id => {
      const t = THEMES[id];
      const sw = el(`
        <div class="theme-swatch ${ebTheme===id?'active':''}" data-theme="${id}">
          <div class="dots">${t.dots.map(c=>`<div class="dot" style="background:${c}"></div>`).join('')}</div>
          <div class="mascot">${t.mascot}</div>
          <div class="tlabel">${esc(t.label)}</div>
        </div>
      `);
      sw.onclick = () => {
        ebTheme = id;
        themeGrid.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('active'));
        sw.classList.add('active');
      };
      themeGrid.appendChild(sw);
    });

    const err = el(`<div class="error-box" style="display:none; margin-top:12px;"></div>`);
    modal.appendChild(err);
    const actions = el(`
      <div class="modal-actions">
        <button class="btn btn-ghost btn-block" id="cancelBtn">취소</button>
        <button class="btn btn-primary btn-block" id="saveBtn">저장</button>
      </div>
    `);
    actions.querySelector('#cancelBtn').onclick = () => { state.modal = null; render(); };
    actions.querySelector('#saveBtn').onclick = async () => {
      const schoolName = modal.querySelector('#ebSchool').value.trim();
      const subjectName = modal.querySelector('#ebSubject').value.trim();
      const labels = modal.querySelector('#ebLabels').value.split('\n').map(s=>s.trim()).filter(Boolean);
      if(labels.length === 0){ err.textContent='도장 칸을 최소 1개 이상 남겨주세요.'; err.style.display='block'; return; }
      const res = await apiCall('updateBoardConfig', {
        schoolName, subjectName, theme: ebTheme, layout: JSON.stringify(labels), teacherPin: state.currentUser.pin
      });
      if(!res || !res.ok){ err.textContent='저장에 실패했어요.'; err.style.display='block'; return; }
      applyBoard({schoolName, subjectName, theme: ebTheme, layout: labels});
      await refreshRoster();
      state.modal = null;
      render();
      toast('도장판 설정을 저장했어요.');
    };
    modal.appendChild(actions);
  }

  bg.appendChild(modal);
  app.appendChild(bg);
}

init();
</script>
